*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    radial-gradient(1100px 520px at 50% -180px, #1d2c47 0%, rgba(20,30,48,0) 62%),
    linear-gradient(180deg,#0a0e16 0%,#080b12 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.5;
  word-break:keep-all;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100dvh;
}
body.no-scroll{overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
h1,h2,h3,h4,p{margin:0}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ---------- screens ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.active{display:flex}

/* ---------- start ---------- */
#scr-start{align-items:center;justify-content:center;padding:28px 20px calc(28px + var(--safe-b))}
.start-wrap{width:100%;max-width:520px}
.hall-label{
  display:inline-block;font-size:11px;letter-spacing:.14em;color:#8fa3c6;
  border:1px solid #2b3a55;border-radius:999px;padding:5px 12px;margin-bottom:18px;
  background:rgba(30,44,68,.5)
}
.title{font-size:34px;line-height:1.16;font-weight:800;letter-spacing:-.02em}
.title .accent{display:block;color:var(--gold);font-size:25px;margin-top:6px;letter-spacing:-.01em}
.title .accent small{display:block;font-size:12px;color:#94a2bd;letter-spacing:.16em;font-weight:600;margin-top:8px}
.lead{margin-top:18px;color:#c3cee2;font-size:14.5px}
.lead b{color:#fff}
.howto{margin:20px 0 16px;display:flex;flex-direction:column;gap:8px}
.howto-item{
  display:grid;grid-template-columns:22px 1fr;align-items:center;gap:11px;font-size:13.5px;color:#cfd9ec;
  background:linear-gradient(180deg,#151f2f,#111a28);
  border:1px solid #24314a;border-radius:12px;padding:11px 13px
}
.howto-item .n{
  flex:0 0 22px;height:22px;border-radius:50%;background:#24314a;color:var(--gold);
  display:grid;place-items:center;font-size:11.5px;font-weight:700
}
.warn-box{
  font-size:12.5px;color:#f0c9b6;background:rgba(226,73,58,.1);
  border:1px solid rgba(226,73,58,.32);border-radius:12px;padding:11px 13px;line-height:1.55
}
.warn-box b{color:#ff9a8a}
.btn-primary{
  width:100%;margin-top:18px;padding:16px;border-radius:14px;
  background:linear-gradient(180deg,#f2c352,#dfa733);color:#231a05;font-weight:800;font-size:16.5px;
  box-shadow:0 8px 20px rgba(222,167,51,.28);letter-spacing:.01em
}
.btn-primary:active{transform:translateY(1px)}
.start-foot{margin-top:14px;text-align:center;font-size:11.5px;color:#6f7f99}

/* ---------- HUD ---------- */
.hud{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(10,14,22,.97),rgba(12,18,28,.93));
  border-bottom:1px solid #1e2a3e;
  backdrop-filter:blur(10px);
  padding:9px 12px 8px;
}
.hud-top{display:flex;align-items:center;gap:10px}
.hud-period{flex:0 0 auto;line-height:1.15}
.hud-period-no{font-size:15px;font-weight:800;color:#fff}
.hud-period-name{font-size:10.5px;color:#8fa3c6;letter-spacing:.06em;margin-top:1px}
.hud-timer{
  flex:1 1 auto;text-align:center;font-size:26px;font-weight:800;letter-spacing:.02em;
  color:#dfe8f7;text-shadow:0 2px 12px rgba(0,0,0,.5)
}
.hud-timer.warn{color:var(--orange)}
.hud-timer.dead{color:#ff6a58;animation:pulse 1s infinite}
.hud-trust{flex:0 0 116px}
.hud-trust-top{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;color:#8fa3c6}
.hud-trust-top b{font-size:14px;color:#e9eefa}
.bar{height:6px;border-radius:99px;background:#1c2738;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#2fbf87,#5fd7a4);transition:width .35s ease,background .35s}
.bar i.mid{background:linear-gradient(90deg,#e0a63a,#f2c352)}
.bar i.low{background:linear-gradient(90deg,#c8402f,#e2493a)}
.hearts{display:flex;gap:3px;margin-top:5px;justify-content:flex-end}
.heart{width:9px;height:9px;border-radius:50%;background:#243149;border:1px solid #31405c}
.heart.on{background:var(--red);border-color:#ff8577;box-shadow:0 0 6px rgba(226,73,58,.6)}
.hud-bottom{display:flex;align-items:center;gap:6px;margin-top:8px}
.hud-chips{display:flex;align-items:center;gap:6px;overflow-x:auto;flex:1 1 auto;scrollbar-width:none;padding:1px 0}
.hud-chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font-size:11px;color:#9fb0ca;background:#131d2b;border:1px solid #22304a;
  border-radius:999px;padding:4px 9px;white-space:nowrap
}
.chip b{color:#fff;font-size:12px;margin-left:2px}
.chip.combo{color:#f2c352;border-color:#4a3c1a;background:#221d0f}
.chip.combo b{color:#f2c352}
.mute{
  flex:0 0 auto;width:34px;height:28px;border-radius:8px;border:1px solid #22304a;
  background:#131d2b;font-size:13px;display:grid;place-items:center
}
.mute.off{opacity:.45}

/* ---------- room ---------- */
.room{flex:1;display:flex;flex-direction:column;gap:9px;padding:10px 12px calc(12px + var(--safe-b));min-height:0}
.room-board{
  font-size:11.5px;color:#8ea2c2;background:rgba(19,29,43,.75);border:1px solid #1e2a3e;
  border-radius:10px;padding:7px 11px;display:flex;align-items:center;gap:8px;line-height:1.35
}
.room-board .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex:0 0 auto}
.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;flex:1;align-content:start}

/* seat card */
.seat{
  position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;
  background:linear-gradient(178deg,#faf7ee 0%,#f0ebdc 72%,#e6e0cd 100%);
  color:var(--ink);border-radius:13px;padding:7px 8px 8px;
  border:1px solid #cfc7b2;
  box-shadow:0 6px 14px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.85);
  overflow:hidden;min-height:152px;
  transition:transform .12s ease,box-shadow .2s ease,filter .2s
}
.seat::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 3px,rgba(120,110,90,.022) 3px 4px);
  mix-blend-mode:multiply
}
.seat:active{transform:translateY(1px) scale(.995)}
.seat-top{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;color:#8b8474;letter-spacing:.02em}
.seat-top .pos{font-weight:800;color:#6c6555;background:#e4ddc9;border-radius:5px;padding:1px 5px}
.av-wrap{
  position:relative;aspect-ratio:2/1;height:auto;margin:2px 0 0;border-radius:8px;overflow:hidden;
  background:linear-gradient(180deg,#e8edf3 0%,#dbe3ec 68%,#cdd6e1 100%);
  border:1px solid #cdc6b3
}
.av-wrap svg{width:100%;height:100%;display:block}
.seat-name{font-size:14px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.seat-tell{
  font-size:10px;color:#6b6455;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;min-height:26px
}
.seat.done{filter:saturate(.55) brightness(.94)}
.seat.done .seat-tell{opacity:.5}
.stamp{
  position:absolute;inset:0;display:none;place-items:center;pointer-events:none;z-index:3
}
.stamp i{
  font-style:normal;font-weight:900;font-size:17px;letter-spacing:.08em;
  border:3px solid currentColor;border-radius:6px;padding:1px 8px;transform:rotate(-11deg);
  opacity:.94
}
.seat.done.out .stamp,
.seat.done.in .stamp,
.seat.done.skip .stamp{display:grid}
.seat.done.out .stamp i{color:#c93b2c}
.seat.done.in .stamp i{color:#2f6fd0}
.seat.alerted{animation:alertShake .5s ease 3}

/* ---------- hint / tool dock ---------- */
.hint{text-align:center;font-size:11px;color:#6f7f99;padding:2px 0 0}

/* ---------- modal ---------- */
.modal{
  position:fixed;inset:0;z-index:60;display:none;
  align-items:flex-end;justify-content:center;
  background:rgba(4,7,12,.66);backdrop-filter:blur(3px);
  padding:0;
}
.modal.open{display:flex;animation:fadeIn .16s ease}
.modal.open .sheet{animation:sheetUp .24s cubic-bezier(.2,.9,.25,1)}
.sheet{
  width:100%;max-width:600px;max-height:92dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#fbf8f0,#f2eddf);
  color:var(--ink);border-radius:18px 18px 0 0;border:1px solid #d3cbb6;border-bottom:0;
  box-shadow:0 -14px 40px rgba(0,0,0,.5);overflow:hidden
}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;border-bottom:1px dashed #cdc4ae;background:#f6f1e5;flex:0 0 auto
}
.sheet-head .lb{font-size:10.5px;letter-spacing:.13em;color:#8a8271;font-weight:700}
.sheet-head-right{display:flex;align-items:center;gap:10px}
.sheet-timer{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:800;color:#7b7361}
.sheet-timer.dead{color:#c33a2c}
.sheet-head .close{width:30px;height:30px;border-radius:8px;background:#e7e0cf;color:#6d6553;font-size:14px;display:grid;place-items:center}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:12px 14px 14px;flex:1 1 auto;-webkit-overflow-scrolling:touch}
.idrow{display:flex;gap:12px;align-items:stretch}
.portrait{
  position:relative;flex:0 0 108px;height:108px;border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,#e9eef4,#d5dee8);border:1px solid #c9c2ae
}
.portrait svg{width:100%;height:100%}
.idinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.idinfo .nm{font-size:19px;font-weight:800;letter-spacing:-.02em}
.idinfo .no{font-size:11.5px;color:#7b7565;letter-spacing:.02em}
.idinfo .seatno{font-size:11.5px;color:#7b7565}
.idinfo .tag{
  margin-top:5px;align-self:flex-start;font-size:10px;font-weight:700;color:#7a5a12;
  background:#f0e2b8;border:1px solid #dfd0a4;border-radius:999px;padding:2px 8px
}
.observe{
  margin-top:11px;font-size:12px;color:#3f4759;background:#efe9d9;border:1px solid #ded6c1;
  border-radius:10px;padding:8px 10px;line-height:1.5
}
.observe b{color:#1b2230}

.clue{display:none;margin-top:11px;border-top:1px dashed #d5ccb6;padding-top:10px}
.clue.show{display:block;animation:fadeIn .22s ease}
.clue h4,.sh{font-size:11.5px;letter-spacing:.04em;color:#8a5a2a;display:flex;align-items:center;gap:6px;margin-bottom:5px;font-weight:700}
.clue h4 .ic{font-size:12px}
.clue p{font-size:12.5px;color:#39414f;line-height:1.58}
.clue p + p{margin-top:5px}
.clue .hl{
  background:linear-gradient(180deg,transparent 58%,rgba(242,195,82,.55) 58%);
  font-weight:700;color:#1b2230
}
.sheetview{
  margin-top:8px;display:flex;gap:10px;align-items:flex-start;
  background:#fffdf7;border:1px solid #ddd5c0;border-radius:9px;padding:7px
}
.sheetview svg{flex:0 0 auto;width:84px;height:auto;border-radius:4px}
.sheetview .sc{font-size:11px;color:#6b6455;line-height:1.45}

/* scan result */
.scan{
  display:none;margin-top:10px;border-radius:10px;padding:9px 11px;
  background:#121b28;color:#dbe6f7;border:1px solid #25344c;font-size:12px;line-height:1.5
}
.scan.show{display:block;animation:fadeIn .22s}
.scan .row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.scan .lbl{font-size:10.5px;color:#8fa3c6;flex:0 0 52px}
.meter{display:flex;gap:3px;flex:1}
.meter i{flex:1;height:7px;border-radius:2px;background:#243149}
.meter i.on{background:linear-gradient(90deg,#3a86ff,#62d0ff);box-shadow:0 0 6px rgba(74,132,255,.55)}
.meter i.hot{background:linear-gradient(90deg,#e2493a,#ff8a5c);box-shadow:0 0 6px rgba(226,73,58,.6)}
.scan .res{font-size:11.5px;color:#b9c8e0;margin-top:2px}
.scan .res b{color:#fff}
.scan .metal{font-size:11px;color:#9fb0ca}

/* interrogation */
.ask-btn{
  width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px;border-radius:11px;font-size:13.5px;font-weight:700;
  background:#e9e2d0;border:1px solid #d6ccb4;color:#2b3446
}
.ask-btn:disabled{opacity:.5}
.ask-btn .cnt{font-size:11px;font-weight:600;color:#8a8271}
.dialogues{margin-top:9px;display:flex;flex-direction:column;gap:7px}
.bubble{
  align-self:flex-start;max-width:94%;background:#fff;border:1px solid #ddd4bf;border-radius:12px 12px 12px 3px;
  padding:8px 11px;font-size:12.5px;line-height:1.5;color:#2b3341;animation:bubbleIn .2s ease
}
.bubble .who{display:block;font-size:9.5px;color:#9a927e;margin-bottom:2px;letter-spacing:.04em}
.bubble.me{align-self:flex-end;background:#dfe7f6;border-color:#c5d2e8;border-radius:12px 12px 3px 12px;color:#22314b}
.bubble.escalate{background:#fff7f4;border-color:#f0c9bc}
.dialogues .quiet{font-size:11px;color:#9a927e;text-align:center;padding:4px}

/* actions */
.sheet-actions{
  flex:0 0 auto;display:flex;gap:9px;padding:11px 13px calc(11px + var(--safe-b));
  background:#f4efe2;border-top:1px solid #d8cfb8
}
.btn-detect,.btn-pass{
  flex:1;padding:14px 8px;border-radius:12px;font-weight:800;font-size:14.5px;letter-spacing:-.01em;
  display:flex;flex-direction:column;align-items:center;gap:1px
}
.btn-detect{background:linear-gradient(180deg,#e2493a,#c33a2c);color:#fff;box-shadow:0 6px 14px rgba(196,58,44,.3)}
.btn-pass{background:linear-gradient(180deg,#f6f1e3,#e7e0cd);color:#2b3446;border:1px solid #cfc6ae}
.btn-detect small,.btn-pass small{font-size:9.5px;font-weight:600;opacity:.72}

/* ---------- toast ---------- */
#toasts{
  position:fixed;left:0;right:0;bottom:0;z-index:90;display:flex;flex-direction:column;
  align-items:center;gap:7px;padding:0 12px calc(16px + var(--safe-b));pointer-events:none
}
.toast{
  max-width:520px;width:100%;border-radius:12px;padding:10px 13px;font-size:12.5px;line-height:1.45;
  background:rgba(24,34,50,.97);border:1px solid #2c3d58;color:#e6eefc;
  box-shadow:0 10px 26px rgba(0,0,0,.5);animation:toastIn .22s ease;display:flex;gap:9px;align-items:flex-start
}
.toast .tt{font-weight:800;flex:0 0 auto}
.toast.good{border-color:#2a6b53;background:rgba(18,44,36,.97)}
.toast.good .tt{color:#5ce0a8}
.toast.bad{border-color:#7a3229;background:rgba(48,26,24,.97)}
.toast.bad .tt{color:#ff8b7a}
.toast.info .tt{color:#8fb4ff}
.toast.gold{border-color:#6b5620;background:rgba(45,37,15,.97)}
.toast.gold .tt{color:var(--gold)}

/* ---------- summary / final ---------- */
.overlay-screen{align-items:center;justify-content:center;padding:22px 16px calc(22px + var(--safe-b))}
.report{width:100%;max-width:520px}
.rep-head{text-align:center;margin-bottom:14px}
.rep-kicker{font-size:11px;letter-spacing:.2em;color:#8fa3c6}
.rep-title{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.rep-sub{font-size:12.5px;color:#93a3bd;margin-top:5px}
.card{
  background:linear-gradient(180deg,#fbf8ef,#f1ecdd);color:var(--ink);border-radius:16px;
  border:1px solid #d3cbb6;box-shadow:var(--shadow);padding:14px 15px
}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#f6f1e4;border:1px solid #e0d8c4;border-radius:10px;padding:8px 10px}
.stat .k{font-size:10.5px;color:#8a8271;letter-spacing:.03em}
.stat .v{font-size:17px;font-weight:800;margin-top:1px}
.stat .v.bad{color:#c33a2c}
.stat .v.good{color:#1f7a54}
.escaped{margin-top:11px;border-top:1px dashed #d5ccb6;padding-top:9px}
.escaped .k{font-size:10.5px;color:#8a8271;letter-spacing:.03em;margin-bottom:5px}
.escaped .row{font-size:11.5px;color:#4a5263;line-height:1.55}
.escaped .row b{color:#1b2230}
.note{margin-top:11px;font-size:11.5px;color:#5d5a4e;background:#efe7d4;border-radius:9px;padding:8px 10px;line-height:1.55}
.grade-card{position:relative;overflow:hidden;text-align:center;margin-bottom:12px}
.grade-card .glabel{font-size:11px;letter-spacing:.2em;color:#8a8271}
.grade-num{font-size:74px;font-weight:900;line-height:1;letter-spacing:-.05em;margin:2px 0 0;color:#b5342a}
.grade-num small{font-size:22px;font-weight:800;vertical-align:super}
.grade-desc{font-size:13px;color:#3f4759;margin-top:6px;line-height:1.5}
.grade-seal{
  position:absolute;right:-16px;top:-14px;width:96px;height:96px;border-radius:50%;
  border:3px solid rgba(181,52,42,.22);transform:rotate(-14deg)
}
.grade-seal::after{content:attr(data-label);position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:900;color:rgba(181,52,42,.24)}
.ptable{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
.ptable th{font-size:10px;color:#8a8271;font-weight:700;text-align:left;padding:4px 3px;border-bottom:1px solid #ded6c1}
.ptable td{padding:5px 3px;border-bottom:1px solid #ece5d4;color:#3f4759}
.ptable td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:#1b2230}
.btn-row{display:flex;gap:9px;margin-top:13px}
.btn-row button{flex:1;padding:14px;border-radius:12px;font-weight:800;font-size:14.5px}
.btn-gold{background:linear-gradient(180deg,#f2c352,#dda32f);color:#241a04}
.btn-ghost{background:#182335;color:#c4d2e8;border:1px solid #2a3b56}

/* ---------- alert flash ---------- */
#flash{
  position:fixed;inset:0;z-index:80;display:none;place-items:center;pointer-events:none;
  background:radial-gradient(circle at 50% 45%,rgba(226,73,58,.3),rgba(4,7,12,.72))
}
#flash.on{display:grid;animation:flashIn .3s ease}
.flash-card{text-align:center;padding:22px 26px;border-radius:16px;background:rgba(16,22,33,.92);border:1px solid #5a2a24;box-shadow:0 0 60px rgba(226,73,58,.35)}
.flash-card .ico{font-size:34px}
.flash-card .t1{font-size:19px;font-weight:900;color:#ff7a68;letter-spacing:-.01em;margin-top:4px}
.flash-card .t2{font-size:11.5px;color:#c9b4b0;margin-top:5px;letter-spacing:.04em}

/* ---------- animations ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bubbleIn{from{opacity:0;transform:translateY(5px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes flashIn{from{opacity:0}to{opacity:1}}
@keyframes alertShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,97%{transform:scaleY(.08)}}
@keyframes jitter{0%,100%{transform:translateX(0)}25%{transform:translateX(-.9px)}75%{transform:translateX(.9px)}}
@keyframes tap{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}45%{transform:rotate(4deg) translateY(1px)}55%{transform:rotate(4deg) translateY(1px)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}
@keyframes sniff{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-2deg)}86%{transform:rotate(1deg)}}
@keyframes hum{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@keyframes markPulse{0%,100%{opacity:.35;r:14}50%{opacity:.9}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.m-rigid .eye{animation:none}
.m-shake .body{animation:jitter .48s infinite}
.m-tap .pencil{transform-box:fill-box;transform-origin:bottom center;animation:tap .42s infinite}
.m-nod .head{transform-box:fill-box;transform-origin:50% 90%;animation:nod 3.4s infinite}
.m-sigh .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.6s infinite}
.m-sniff .head{transform-box:fill-box;transform-origin:50% 90%;animation:sniff 3.2s infinite}
.m-hum .mouth{transform-box:fill-box;transform-origin:center;animation:hum 1.1s infinite}
.m-still .eye{animation:none}
.mark-ring{animation:markPulse 1.8s infinite}

/* ---------- desktop ---------- */
@media (min-width:720px){
  body{font-size:15px}
  .hud{padding:11px 20px 10px}
  .hud-period-no{font-size:17px}
  .hud-timer{font-size:30px}

  .seats{align-content:center}
  .seat-name{font-size:15.5px}
  .seat-tell{font-size:10.5px;min-height:29px}
  .modal{align-items:center;padding:20px}
  .sheet{border-radius:18px;border-bottom:1px solid #d3cbb6;max-height:88vh}
  .portrait{flex:0 0 130px;height:130px}
  .idinfo .nm{font-size:21px}

  .start-wrap{max-width:560px}
  .btn-primary:hover{filter:brightness(1.05)}
  .seat:hover{box-shadow:0 10px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.9)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important}
}

/* ---------- v1.4: 시험관리본부 특별담화 ---------- */
.decree-sheet{background:linear-gradient(180deg,#fbf6e8,#f0e7d2)}
.decree-sheet .sheet-body{padding:16px 16px 20px;overflow-y:auto}
.decree-stamp{float:right;width:58px;height:58px;margin:2px 0 8px 10px;border:2px solid #b03a2c;border-radius:50%;color:#b03a2c;display:grid;place-items:center;text-align:center;font-size:10.5px;font-weight:800;line-height:1.15;transform:rotate(-8deg);opacity:.72;letter-spacing:.02em}

.decree-sheet .clause p{font-size:13px;color:#39414f;line-height:1.62}

.decree-note{padding:0 1px}

/* ============================================================
   v1.5 — 시험장 씬(배경 + 빛 · 먼지 레이어)
   ============================================================ */
.scene-cover{
  position:relative;overflow:hidden;height:250px;border-radius:18px;
  border:1px solid rgba(45,80,68,.9);
  background-image:linear-gradient(180deg,rgba(255,248,222,.10),rgba(8,22,18,.34)),var(--scene);
  background-size:cover;background-position:center 44%;background-repeat:no-repeat;
  box-shadow:inset 0 0 70px rgba(8,22,18,.34),0 12px 26px rgba(0,0,0,.36)
}
.scene-banner{
  position:relative;overflow:hidden;border-radius:13px;min-height:175px;
  border:1px solid rgba(45,80,68,.9);
  background-image:linear-gradient(180deg,rgba(255,248,222,.06),rgba(8,22,18,.30)),var(--scene);
  background-size:cover;background-position:center 38%;background-repeat:no-repeat;
  box-shadow:inset 0 0 50px rgba(8,22,18,.30)
}
.scene-cover::before,.scene-banner::before{
  content:"";position:absolute;inset:-15%;pointer-events:none;
  background:linear-gradient(103deg,rgba(255,246,206,0) 16%,rgba(255,246,206,.32) 30%,rgba(255,246,206,0) 44%,rgba(255,246,206,.15) 58%,rgba(255,246,206,0) 72%);
  mix-blend-mode:screen;animation:sunSweep 14s ease-in-out infinite
}
.scene-cover::after,.scene-banner::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 100% at 50% 42%,rgba(0,0,0,0) 52%,rgba(5,16,14,.42) 100%)
}
.scene-fx{
  position:absolute;inset:0;pointer-events:none;opacity:.8;
  background-image:
    radial-gradient(1.6px 1.6px at 14% 25%,rgba(255,252,236,.9),transparent 60%),
    radial-gradient(1.3px 1.3px at 32% 62%,rgba(255,252,236,.75),transparent 60%),
    radial-gradient(1.8px 1.8px at 51% 33%,rgba(255,252,236,.8),transparent 60%),
    radial-gradient(1.2px 1.2px at 67% 71%,rgba(255,252,236,.7),transparent 60%),
    radial-gradient(1.5px 1.5px at 82% 41%,rgba(255,252,236,.8),transparent 60%),
    radial-gradient(1.1px 1.1px at 92% 66%,rgba(255,252,236,.6),transparent 60%);
  animation:dustDrift 11s ease-in-out infinite
}
@keyframes sunSweep{0%,100%{transform:translateX(-5%) rotate(0deg);opacity:.85}50%{transform:translateX(5%) rotate(.6deg);opacity:1}}
@keyframes dustDrift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.scene-cover::before,.scene-banner::before,.scene-fx{animation:none}}

<div id="app">

  <!-- START -->

  ref:['Cúc B-41 · mô-đun tai B-42','Cả hai nhãn kết nối: CH-6. Ghi nhận: 27 / ④.','B-41 và B-42: không có trong danh sách đăng ký trước. CH-6: kênh nhận thẻ đáp án bên ngoài chưa đăng ký — có ghi nhận câu hỏi và phương án.'],
  clue:'Cửa sổ đồ dùng hư cấu cho thấy kênh đáp án ngoài chưa đăng ký (CH-6) được nối từ thiết bị ở cúc và ở tai. Màu tai nghe hay tốc độ trả lời không phải lý do.'},

 B5:{name:'Juwon Seo',

  sheet:'Đúng 100%, tốc độ viết đều, không một hạt tẩy nào.',

  caught:'Mô-đun B-58 ở cổ áo và mô-đun B-59 ở tai có cùng ghi nhận nhận đáp án từ bên ngoài.',

 P1:{name:'Minjae Kang',

     'À, thầy chờ em chút. Chân em bị tê… (tay cậu ấy với xuống cổ chân)'],
  caught:'Tháo giày ra thì thấy một chiếc điện thoại gập dưới lót giày. Trên màn hình là cửa sổ chat với AI.',

  clue:'Cửa sổ đồ dùng trong game cho thấy một điện thoại chưa nộp đang nhận đáp án của câu hiện tại qua kênh chưa đăng ký BLE-4. Chân sưng hay miếng lót không phải lý do.'},

 P2:{name:'Chaewon Lim',
  tell:'Cứ quay đầu về phía chiếc cặp',

  sheet:'Ba đáp án đột nhiên được viết một mạch, nét chữ khác hẳn trước đó.',

     'Rung ạ? Chắc là thông báo tàu điện… à, em nộp điện thoại rồi ạ.',
     'Thầy mở ra thì biết. Thật sự không có gì đâu ạ.'],
  caught:'Trong cặp, điện thoại nằm trong hộp bút; chiếc hộp được làm giả như sách giáo khoa.',
  escaped:'Khóa kéo vẫn đóng, còn đáp án vẫn tiếp tục được gửi đến.',
  scan:'Tín hiệu trung bình. Nguồn phát <b>trong cặp cạnh ghế</b>. Có phản ứng kim loại.',
  ref:['Điện thoại P-23','Màn hình: 17 / ⑤. Nhãn kết nối: CH-12.','P-23: không có trong danh sách nộp máy. CH-12: kênh nhận thẻ đáp án bên ngoài chưa đăng ký — có ghi nhận câu hỏi và phương án.'],
  clue:'Cửa sổ kiểm tra hư cấu xác nhận chiếc điện thoại chưa nộp trong cặp đang nhận đáp án ngoài cho câu hiện tại qua kênh chưa đăng ký CH-12. Ánh sáng hay rung động thôi không đủ căn cứ.'},

 P3:{name:'Hajun Roh',
  tell:'Một tay luôn ở trong túi quần',
  look:'Ở miệng túi, một màn hình nhỏ đang đổi số câu. Có thể so danh sách nộp máy và nhật ký nhận của thiết bị P-36.',
  sheet:'Cậu ấy ngừng viết, sờ túi, rồi viết. Khoảng cách đúng 40 giây.',
  q:['Để tay trong túi thì có gì sai ạ?',

     'Thầy ơi, thầy để em yên được không ạ?'],
  caught:'Lấy từ túi ra một chiếc điện thoại, màn hình chuyển qua lại giữa ảnh chụp phiếu thi và câu trả lời của AI.',
  escaped:'Cậu ấy làm hết bài với tay vẫn trong túi.',

  ref:['Điện thoại P-36','Màn hình: 23 / ④. Nhãn kết nối: CH-7.','P-36: không có trong danh sách nộp máy. CH-7: kênh nhận thẻ đáp án bên ngoài chưa đăng ký — có ghi nhận câu hỏi và phương án.'],
  clue:'Cửa sổ đồ dùng hư cấu cho thấy điện thoại chưa nộp và ghi nhận nhận đáp án của câu hiện tại qua kênh chưa đăng ký CH-7. Đường nét trong túi tự nó không quyết định.'},

 P4:{name:'Seyoung Moon',
  tell:'Ngồi thẳng lưng, gần như không cử động thân trên',
  look:'Cạnh đai lưng có một màn hình nhỏ gắn số P-44, hiện số câu và số phương án hiện tại. Cần kiểm tra việc nộp máy và nhật ký nhận, không phải chiếc đai.',

  caught:'Từ đai lưng lấy ra một chiếc điện thoại. Ảnh chụp phiếu thi trong nhà vệ sinh vẫn còn trong máy.',
  escaped:'Cậu ấy làm xong bài mà không đổi tư thế một lần nào.',

  ref:['Điện thoại P-44','Màn hình: 28 / ③. Nhãn kết nối: CH-2.','P-44: không có trong danh sách nộp máy. CH-2: kênh nhận thẻ đáp án bên ngoài chưa đăng ký — có ghi nhận câu hỏi và phương án.'],
  clue:'Cửa sổ kiểm tra hư cấu cho thấy điện thoại chưa nộp ở vùng thắt lưng đang nhận đáp án của câu hiện tại qua kênh chưa đăng ký CH-2. Đai lưng hay việc điểm số tăng vọt không phải bằng chứng.'},

 I1:{name:'Doyun Kim',
  tell:'Cứ rung đùi và đẩy kính lên',
  look:'Gọng dày, nhưng tròng có độ và bên trong gọng nhẵn — không nút, không lỗ thấu kính, không rãnh.',
  sheet:'Sai câu 12 rồi tẩy đi, ở lề có nét nguệch ngoạc <span class="hl">chán thật</span>.',
  q:['Dạ? Kính của em ạ? Em cận từ hồi tiểu học.',
     'Em rung đùi vì lo lắng ạ. Em xin lỗi.',
     'Thầy ơi… em là người thật mà. Em thi tiếp được không ạ?'],
  protest:'Tháo kính ạ? À… vâng. (đưa kính ra) Đây chỉ là kính thôi… thời gian thi của em hết mất rồi.',
  ok:'Em xin lỗi. Vì lo nên chân em cứ rung… em cảm ơn thầy.',
  scan:'Không có tín hiệu sóng. Phản ứng kim loại là gọng kính.',
  ref:['Kính có độ thông thường','Cả hai càng kính và bên trong tròng: không có linh kiện điện tử, không màn hình.','Kính không điện tử: không cần đăng ký. Kính có độ không có chức năng truyền đáp án thì được phép.'],
  clue:'Đã xác nhận là kính có độ thông thường: không nút, không mạch, không màn hình. Rung đùi hay vẻ lo lắng không phải bằng chứng gian lận.'},

 I2:{name:'Seojun Lee',
  tell:'Cứ sờ vào cúc áo và gãi sau gáy',
  look:'Một chiếc cúc trông hơi bong — nhưng đường khâu đã cũ và chỉ bị tuột. Không có thấu kính hay bảng mạch.',
  sheet:'Phiếu chi chít vết tẩy; câu 5 đã đổi đáp án ba lần.',
  q:['Cúc áo ạ? Chỉ bị tuột nên em cứ sờ vào.',
     'Hôm qua em vội khâu nên vậy ạ.',
     'Vì một chiếc cúc mà em bị nghi ngờ sao ạ?'],
  protest:'Bảo em cắt cúc ra ạ? Đây là cái em tự khâu hôm qua… thầy định bảo em cởi áo ra à?',
  ok:'À… vâng. Lần sau em sẽ khâu cúc cẩn thận ạ.',
  scan:'Không có tín hiệu sóng. Không có phản ứng kim loại.',
  ref:['Cúc áo sơ mi','Mặt trước, mặt sau và đường khâu: không có linh kiện hay thấu kính.','Cúc áo không điện tử: không cần đăng ký. Đường khâu bong hay màu áo không phải tiêu chí phán quyết.'],
  clue:'Đã xác nhận là cúc áo bị bong: không có thấu kính, bảng mạch hay ghi nhận nhận đáp án.'},

 I3:{name:'Hayoon Jung',
  tell:'Cứ sờ một bên tai và thở dài thật to',
  look:'Dái tai đỏ. Bên trong tai không có tai nghe, không chấm đen, không băng dính. Chỉ còn vết móng tay.',
  sheet:'Phiếu bình thường, có dấu hiệu đã đắn đo lâu ở câu 9.',
  q:['Tai em đau từ hôm qua ạ.',
     'Thở dài chỉ là… vì em không giải được bài.',
     'Thầy ơi, thầy xem giúp tai em được không ạ? Đau quá.'],
  protest:'Em sờ tai vì đau… em làm hỏng bài thi mất rồi. Sao lại thế này ạ.',
  ok:'Vâng… em cảm ơn. Em sờ tai một chút được không ạ?',
  scan:'Không có tín hiệu sóng. Không có phản ứng kim loại.',
  ref:['Vùng quanh tai','Bên ngoài và cửa tai: không có thiết bị gắn kèm.','Không mang thiết bị: không cần đăng ký. Màu tai hay cơn đau không phải tiêu chí phán quyết.'],
  clue:'Đã xác nhận bên trong tai không có thiết bị. Cơn đau hay việc sờ tai không bao giờ là căn cứ phán quyết.'},

 I4:{name:'Jihoon Park',
  tell:'Cứ 30 giây lại xem đồng hồ đeo tay',
  look:'Đồng hồ cơ trên cổ tay, vỏ kim loại. Mặt kính chỉ có vết xước, không có camera hay thấu kính.',
  sheet:'Trên phiếu có ghi phân bổ thời gian (10:12 → câu 32) và nhiều vết tẩy.',
  q:['Em canh thời gian thi ạ. Thầy cũng biết mà.',
     'Đây không phải đồng hồ thông minh. Đồng hồ lên dây ạ.',
     'Sao thầy lại lấy đồng hồ của em ạ?'],
  protest:'Đồng hồ ạ? Đây là đồng hồ lên dây, thầy xem đi. Không có đồng hồ thì em không canh được thời gian.',
  ok:'À… vâng. Em vẫn được đeo đồng hồ chứ ạ?',
  scan:'Không có tín hiệu sóng. Phản ứng kim loại là đồng hồ đeo tay.',
  ref:['Đồng hồ lên dây','Mặt kính, cạnh và bộ máy: có bánh răng. Không có mạch truyền nhận, không hiện câu hỏi.','Đồng hồ không điện tử: không cần đăng ký. Là vật dụng được phép trong kỳ thi hư cấu này.'],
  clue:'Đã xác nhận là đồng hồ cơ thông thường, không có chức năng hay ghi nhận truyền đáp án.'},

 I5:{name:'Eunseo Choi',
  tell:'Cứ cúi xuống nhìn cổ tay',
  look:'Đồng hồ thông minh màu đen, màn hình hiện đồng hồ đếm <span class="hl">00:42</span>. Chỉ có cảm biến mặt sau, không có ống kính camera. Trong kỳ thi hư cấu này, đồng hồ cá nhân đã đăng ký trước được phép; sổ đăng ký khớp số máy và việc nhận phát thanh phòng thi (CH-8) cũng được đăng ký kèm.',
  sheet:'Phiếu bình thường; câu 3 bị tẩy hai lần.',
  q:['Đồng hồ để xem giờ ạ. Phòng thi không cho xem đồng hồ sao ạ?',
     'Em đặt hẹn giờ. Còn 30 giây thì nó kêu ạ.',
     'Điện thoại em ở trong tủ. Nhìn đồng hồ cũng không được ạ?'],
  protest:'Nếu lấy đồng hồ thì em biết giờ bằng cách nào? Hướng dẫn kỳ thi hư cấu có ghi là đồng hồ cá nhân đăng ký trước được phép mà.',
  ok:'Vâng… em sẽ tắt hẹn giờ. Em cảm ơn ạ.',
  scan:'Tín hiệu tự phát yếu — <b>đồng hồ hẹn giờ đã đăng ký T-05</b>. Nhận phát thanh phòng thi (CH-8) là chức năng bình thường đã đăng ký. Không có ghi nhận câu hỏi hay phương án. Có phản ứng kim loại.',
  ref:['Đồng hồ cá nhân T-05','Màn hình: 00:42. Nhãn kết nối: LOCAL · phát thanh phòng thi CH-8. Không có ghi nhận câu hỏi hay phương án.','T-05: đã đăng ký trước là đồng hồ hẹn giờ. CH-8 là kênh phát thanh phòng thi và là tín hiệu nhận bình thường đã đăng ký — không có ghi nhận đáp án.'],
  clue:'Là đồng hồ cá nhân đã đăng ký trước, sổ đăng ký khớp số máy. CH-8 là kênh phát thanh phòng thi và là tín hiệu nhận bình thường đã đăng ký, không có ghi nhận câu hỏi hay phương án. Điều này không nói lên quy định thi thật nào.'},

 I6:{name:'Jiwoo Han',
  tell:'Một bên tai có thứ gì đó, và khi có tiếng động thì quay đầu lại',
  look:'Tai trái đeo <span class="hl">máy trợ thính</span> — loại đúc theo hình tai, cấu trúc khác tai nghe. Tai còn lại trống. Sổ đăng ký cũng ghi việc nhận phát thanh phòng thi (CH-8).',
  sheet:'Có dấu đã đọc ngữ liệu hai lần và ghi từ khóa ra lề.',
  q:['Đây là máy trợ thính ạ. Em bị khiếm thính từ khi sinh ra.',
     'Tháo ra ạ? Tháo ra thì em không nghe được người đọc đề.',
     'Thầy ơi, em có phải mang giấy xác nhận không ạ?'],
  protest:'Tháo cái này ra là em không nghe được. Đây có phải là phân biệt đối xử không… thầy ơi, em thật sự cần nó.',
  ok:'Cảm ơn thầy đã hiểu. Em sẽ cố gắng ạ.',
  scan:'Tín hiệu yếu — máy trợ thính H-06. Nhận lặp phát thanh phòng thi (CH-8) là chức năng bình thường đã đăng ký. Không có ghi nhận câu hỏi hay phương án. Có phản ứng kim loại.',
  ref:['Máy trợ thính H-06','Số máy: H-06. Nhãn kết nối: CH-8 (lặp phát thanh phòng thi). Không có ghi nhận câu hỏi hay phương án.','H-06: đã đăng ký trước là thiết bị hỗ trợ. CH-8 là kênh phát thanh phòng thi và là tín hiệu nhận bình thường đã đăng ký — không có ghi nhận đáp án.'],
  clue:'Là máy trợ thính đã đăng ký trước, số máy khớp sổ đăng ký; việc nhận lặp phát thanh CH-8 là chức năng bình thường đã đăng ký. Không có ghi nhận đáp án. Không bao giờ phán đoán vì thiết bị hỗ trợ hay vì khuyết tật.'},

 I7:{name:'Sehoon Oh',
  tell:'Cứ xoay bút giữa các ngón tay',
  look:'Bút không có lỗ, không camera trong nắp, không thấu kính. Chỉ là tay cậu ấy ra nhiều mồ hôi nên bút bị trượt.',

  const a = ac(); if(!a) return;
  try{

    g.gain.linearRampToValueAtTime(vol==null?0.06:vol, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}

/* ============================================================
   SVG — OMR 답안지
   ============================================================ */
function omrSVG(marks){
  const digits = String(marks || '31245213').split('');
  const top = 8, rowH = 9.4;
  const h = top + digits.length * rowH + 4;
  const out = [];
  out.push('<rect x="0" y="0" width="78" height="'+h+'" fill="#fffdf7"/>');
  digits.forEach(function(d,i){
    const y = top + i*rowH;
    out.push('<text x="3" y="'+(y+3.2)+'" font-size="4.6" fill="#a29a86" font-family="sans-serif">'+(i+1)+'</text>');
    for(let k=1;k<=5;k++){
      const filled = String(k) === d;
      out.push('<circle cx="'+(12+k*11.4)+'" cy="'+y+'" r="3.1" fill="'+(filled?'#2b3341':'none')+'" stroke="#bcb29a" stroke-width=".7"/>');
    }
  });
  return '<svg viewBox="0 0 78 '+h+'" xmlns="http://www.w3.org/2000/svg">'+out.join('')+'</svg>';
}

function toast(msg, kind, title){
  const wrap = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'info');
  el.innerHTML = '<span class="tt">'+(title||t('toast.title'))+'</span><span>'+msg+'</span>';
  wrap.appendChild(el);
  while(wrap.children.length > 3) wrap.removeChild(wrap.firstChild);
  setTimeout(function(){
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, kind === 'bad' ? 4200 : 3400);
}

function newGame(practice){
  st.practice=!!practice;
  roundEpoch++;
  CASES.forEach(c=>{c.art=ART_PALETTES[Math.floor(Math.random()*ART_PALETTES.length)]});
  st.period = 0; st.score = 0; st.trust = 100; st.combo = 0; st.bestCombo = 0;
  st.used = new Set(); st.results = []; st.seats = []; st.pstats = {caught:0,wrong:0,missed:0,ok:0};
  st.running = false; st.activeSeat = null;
  closePanel();
  startPeriod();
}

function pickCheats(n, tiers, used, forcePhone){
  const pool = shuffle(CASES.filter(function(c){
    return c.type !== 'clean' && tiers.indexOf(c.tier) >= 0 && !used.has(c.id);
  }));
  const out = [];
  if(forcePhone){
    const ph = pool.filter(function(c){ return c.type === 'phone'; })[0];
    if(ph) out.push(ph);
  }
  const rest = pool.filter(function(c){ return out.indexOf(c) < 0; });
  while(out.length < n && rest.length) out.push(rest.shift());
  if(out.length > 1){
    const types = out.map(function(c){ return c.type; });
    const allSame = types.every(function(t){ return t === types[0]; });
    if(allSame && rest.length) out[out.length-1] = rest[0];
  }
  out.forEach(function(c){ used.add(c.id); });
  return out;
}

function pickCleans(n, tiers, used){
  const pool = shuffle(CASES.filter(function(c){
    return c.type === 'clean' && tiers.indexOf(c.tier) >= 0 && !used.has(c.id);
  }));
  const out = pool.slice(0, n);
  out.forEach(function(c){ used.add(c.id); });
  return out;
}

function startPeriod(){
  const cfg = PERIODS[st.period];
  roundEpoch++;
  const periodEpoch=roundEpoch;
  st.pstats = {caught:0, wrong:0, missed:0, ok:0};
  st.pfeedback=[];
  st.scans = cfg.scans;
  st.alerts = 1;
  st.timeLeft = cfg.time;
  st.clearLeft = null;
  st.lastTick = 99;
  st.combo = 0;
  st.ended = false;
  st.seats = [];

  const cheats = pickCheats(cfg.cheats, cfg.cheatTiers, st.used, cfg.forcePhone);
  const cleans = pickCleans(6 - cheats.length, cfg.cleanTiers, st.used);
  const all = shuffle(cheats.concat(cleans));

  all.forEach(function(c,i){
    st.seats.push({
      i:i, pos:i+1, c:c, resolved:false, verdict:null,
      inspected:false, scan:null, qIdx:0, el:null
    });
  });

  $('#roomBoard').textContent = boardText();
  show('scr-game');
  renderSeats();
  if(st.seats[0]&&st.seats[0].el)st.seats[0].el.focus({preventScroll:true});
  updateHUD();
  updateTimer();

  st.running = true;
  st.deadline = performance.now() + cfg.time * 1000;
  clearInterval(st.timer);
  st.timer = setInterval(tick, 100);

  setTimeout(function(){
    if(periodEpoch!==roundEpoch||!st.running)return;
    if(st.period === 0){
      toast(t('toast.start1'), 'info', t('toast.startTitle'));
    } else {
      const msg = st.period === 1 ? t('toast.period2') : t('toast.period3');
      toast(msg, 'info', t('toast.periodTitle', {n: st.period+1}));
    }
  }, 400);
}

function tick(){
  if(!st.running||st.practice) return;
  const left = (st.deadline - performance.now()) / 1000;
  st.timeLeft = Math.max(0, left);
  updateTimer();
  const s = Math.ceil(st.timeLeft);
  if(s === 20 && st.lastTick !== 20){ st.lastTick = 20; SFX.warn(); vibrate(15); }
  if(s <= 10 && s > 0 && s !== st.lastTick){ st.lastTick = s; SFX.tick(); if(s === 10){ vibrate([70,50,70]); } }
  if(left <= 0){ st.timeLeft = 0; endPeriod('time'); }
}

/* ============================================================
   판정
   ============================================================ */
function freezeCompletedClock(){
 if(!st.practice&&st.clearLeft==null&&st.seats.every(s=>s.resolved)){
  st.clearLeft=Math.max(0,(st.deadline-performance.now())/1000);st.timeLeft=st.clearLeft;clearInterval(st.timer);updateTimer();
 }
}
function judge(verdict){
  if(st.running&&st.clearLeft==null&&!st.practice&&performance.now()>=st.deadline){tick();return;}
  const seat = st.activeSeat;
  if(!seat || !st.running || seat.resolved) return;
  const c = seat.c;
  seat.resolved = true;
  seat.verdict = verdict;
  freezeCompletedClock();

  if(verdict === 'catch'){
    if(c.type !== 'clean'){
      st.pstats.caught++;
      st.combo++;
      st.bestCombo = Math.max(st.bestCombo, st.combo);
      const mult = 1 + 0.2 * Math.min(st.combo-1, 5);
      const gain = Math.round(130 * mult);
      st.score += gain;
      st.trust = clamp(st.trust + 6, 0, 100);
      SFX.catch(); vibrate(40);
      toast(t('toast.catch', {name:c.name, gain:gain, combo:(st.combo>1?t('toast.combo',{mult:mult.toFixed(1)}):''), detail:c.caught}), 'good', t('toast.catchTitle'));
    } else {
      st.pstats.wrong++;
      st.combo = 0;
      st.score = Math.max(0, st.score - 60);
      st.trust = clamp(st.trust - 20, 0, 100);
      SFX.wrong(); vibrate([90,60,90]);
      toast(t('toast.wrong', {name:c.name, detail:c.protest}), 'bad', t('toast.wrongTitle'));
    }
  } else {
    if(c.type !== 'clean'){
      st.pstats.missed++;
      st.combo = 0;
      st.trust = clamp(st.trust - 8, 0, 100);
      SFX.wrong();
      toast(t('toast.miss', {name:c.name, detail:c.escaped}), 'bad', t('toast.missTitle'));
    } else {
      st.pstats.ok++;
      st.score += 25;
      st.trust = clamp(st.trust + 1, 0, 100);
      SFX.pass(); vibrate(15);
      toast(t('toast.ok', {name:c.name, detail:c.ok}), 'good', t('toast.okTitle'));
    }
  }

  const feedback=verdict==='catch'?(c.type==='clean'?c.protest:c.caught):(c.type==='clean'?c.ok:c.escaped);
  (st.pfeedback||(st.pfeedback=[])).push({name:c.name,verdict:verdict==='catch'?t('v.out'):t('v.pass'),detail:feedback});
  closePanel();
  updateSeatCard(seat);
  updateHUD();
  const nextSeat=st.seats.find(s=>!s.resolved);if(nextSeat&&nextSeat.el)nextSeat.el.focus({preventScroll:true});

  if(st.trust <= 0){
    st.running = false;
    const failedEpoch=roundEpoch;setTimeout(function(){ if(failedEpoch===roundEpoch)endPeriod('disqualified'); }, 720);
    return;
  }
  const epoch=roundEpoch;setTimeout(function(){ if(epoch===roundEpoch)maybeEndPeriod(); }, 480);
}

function maybeEndPeriod(){
  if(!st.running) return;
  const left = st.seats.filter(function(s){ return !s.resolved; }).length;
  if(left === 0) endPeriod('clear');
}

/* ============================================================
   확인 신호
   ============================================================ */
function sendAlert(){
  if(!st.running||st.seats.every(s=>s.resolved)) return;
  if(!st.practice&&performance.now()>=st.deadline){tick();return;}
  if(st.alerts <= 0){
    toast(t('toast.alertOut'), 'info', t('toast.alertTitle'));
    return;
  }
  const alertEpoch=roundEpoch;
  st.alerts--;
  updateHUD();
  st.deadline += 2600;
  const f = $('#flash');
  f.classList.add('on');
  SFX.siren(); vibrate([80,60,80,60,160]);
  st.seats.forEach(function(s){
    if(!s.resolved && s.el) s.el.classList.add('alerted');
  });
  setTimeout(function(){ f.classList.remove('on'); }, 1600);

  setTimeout(function(){
    if(alertEpoch!==roundEpoch||!st.running)return;
    st.seats.forEach(function(s){ if(s.el) s.el.classList.remove('alerted'); });
    const phones = st.seats.filter(function(s){ return !s.resolved && s.c.type === 'phone'; });
    phones.forEach(function(s,i){
      setTimeout(function(){ if(alertEpoch===roundEpoch)autoCatch(s); }, i*220);
    });
    if(!phones.length){
      toast(t('toast.alertNone'), 'info', t('toast.alertTitle'));
    } else {
      toast(phones.length === 1 ? t('toast.alertSome1') : t('toast.alertSome', {n: phones.length}), 'gold', t('toast.alertTitle'));
    }
  }, 1700);
}

function autoCatch(seat){
  if(st.running&&st.clearLeft==null&&!st.practice&&performance.now()>=st.deadline){tick();return;}
  if(seat.resolved || !st.running) return;
  seat.resolved = true;
  seat.verdict = 'catch';
  freezeCompletedClock();
  seat.alerted = true;
  (st.pfeedback||(st.pfeedback=[])).push({name:seat.c.name,verdict:t('v.alert'),detail:seat.c.caught});
  if(st.activeSeat===seat)closePanel();
  st.pstats.caught++;
  st.combo++;
  st.bestCombo = Math.max(st.bestCombo, st.combo);
  const gain = Math.round(100 * (1 + 0.2 * Math.min(st.combo-1, 5)));
  st.score += gain;
  st.trust = clamp(st.trust + 2, 0, 100);
  updateSeatCard(seat);
  updateHUD();
  const nextSeat=st.seats.find(s=>!s.resolved);if(nextSeat&&nextSeat.el)nextSeat.el.focus({preventScroll:true});
  SFX.catch(); vibrate(60);
  toast(t('toast.alertCatch', {name:seat.c.name, gain:gain, detail:seat.c.caught}), 'good', t('toast.alertCatchTitle'));
  const epoch=roundEpoch;setTimeout(function(){ if(epoch===roundEpoch)maybeEndPeriod(); }, 520);
}

/* ============================================================
   교시 종료
   ============================================================ */
function endPeriod(reason){
  if(st.ended) return;
  st.ended = true;
  st.running = false;
  clearInterval(st.timer);
  closePanel();

  const escaped = [];
  st.seats.forEach(function(s){
    if(s.resolved) return;
    s.resolved = true;
    if(s.c.type === 'clean'){
      s.verdict = 'skip';
      st.trust -= 3;
    } else {
      s.verdict = 'missed';
      st.pstats.missed++;
      st.trust -= 12;
      escaped.push(s.c);
    }
    updateSeatCard(s);
  });

  let bonus = 0;
  if(reason !== 'disqualified'&&(reason === 'clear'||st.clearLeft!=null)&&!st.practice){
    bonus = Math.round(Math.max(0, st.clearLeft??st.timeLeft) * 0.8);
    st.score += bonus;
  }
  st.trust = clamp(st.trust, 0, 100);
  updateHUD();

  st.results.push({
    no: PERIODS[st.period].no,
    subject: PERIODS[st.period].subject,
    caught: st.pstats.caught,
    wrong: st.pstats.wrong,
    missed: st.pstats.missed,
    ok: st.pstats.ok,
    bonus: bonus,
    score: st.score,
    trust: Math.round(st.trust)
  });

  if(st.trust <= 0 || reason === 'disqualified'){
    renderFinal(true);
    return;
  }
  st.lastReport = {escaped: escaped, bonus: bonus};
  renderPeriodReport(escaped, bonus);
}

}

function gradeOf(total, disqualified){
  if(disqualified) return { g:9, desc:t('grade.disq') };
  const bands = [
    [1900, 1], [1700, 2], [1500, 3], [1350, 4], [1200, 5],
    [1050, 6], [900, 7], [750, 8], [0, 9]
  ];
  for(let i=0;i<bands.length;i++){
    if(total >= bands[i][0]) return { g:bands[i][1], desc:t('grade.'+bands[i][1]) };
  }
  return { g:9, desc:t('grade.9') };
}

function renderFinal(disqualified){
  st.running = false;
  st.lastDisq = !!disqualified;
  clearInterval(st.timer);
  closePanel();
  const total = Math.max(0, Math.round(st.score)) + Math.max(0, Math.round(st.trust)) * 4;
  const gr = st.practice&&!disqualified?{g:'✓',desc:t('grade.practice')}:gradeOf(total, disqualified);
  const caughtAll = st.results.reduce(function(a,r){ return a + r.caught; }, 0);
  const missedAll = st.results.reduce(function(a,r){ return a + r.missed; }, 0);
  const wrongAll = st.results.reduce(function(a,r){ return a + r.wrong; }, 0);
  const h = [];

  h.push('<div class="rep-head">');
  h.push('<div class="rep-kicker">'+t('final.kicker')+'</div>');

  h.push('<div class="card grade-card">');

  h.push('<div class="grade-num">'+gr.g+'<small>'+(st.practice?t('final.unitPractice'):t('final.unit'))+'</small></div>');
  h.push('<div class="grade-desc">'+(disqualified?t('final.disqDesc'):st.practice?t('final.practiceDesc'):t('final.desc',{caught:caughtAll,missed:missedAll,wrong:wrongAll}))+'</div>');
  h.push('</div>');

  h.push('<div class="card">');
  h.push('<div class="stat-grid">');
  h.push('<div class="stat"><div class="k">'+t('stat.total')+'</div><div class="v">'+won(total)+'</div></div>');
  h.push('<div class="stat"><div class="k">'+t('stat.trustLeft')+'</div><div class="v '+(st.trust<=30?'bad':'good')+'">'+Math.round(st.trust)+'</div></div>');
  h.push('<div class="stat"><div class="k">'+t('stat.caughtMissed')+'</div><div class="v">'+caughtAll+'<span style="font-size:12px;color:#8a8271"> / '+missedAll+'</span></div></div>');
  h.push('<div class="stat"><div class="k">'+t('stat.bestCombo')+'</div><div class="v">'+st.bestCombo+'</div></div>');
  h.push('</div>');

  h.push('<table class="ptable"><thead><tr><th>'+t('table.period')+'</th><th>'+t('table.caught')+'</th><th>'+t('table.wrong')+'</th><th>'+t('table.missed')+'</th><th style="text-align:right">'+t('table.cum')+'</th></tr></thead><tbody>');
  st.results.forEach(function(r){
    h.push('<tr><td>'+t('table.row',{n:r.no,subject:r.subject})+'</td><td>'+r.caught+'</td><td'+(r.wrong?' style="color:#c33a2c;font-weight:700"':'')+'>'+r.wrong+'</td><td>'+r.missed+'</td><td class="n">'+won(r.score)+'</td></tr>');
  });
  h.push('</tbody></table>');

  h.push('<div class="note">'+t('final.note',{wrong:wrongAll})+'</div>');
  h.push('</div>');

  h.push('<div class="btn-row">');
  h.push('<button class="btn-gold" id="btnRetry">'+t('btn.retry')+'</button>');
  h.push('<button class="btn-ghost" id="btnHome">'+t('btn.home')+'</button>');
  h.push('</div>');
  h.push('<a class="kofi-link kofi-final" href="https://ko-fi.com/radarcat" target="_blank" rel="noopener noreferrer" aria-label="'+t('start.kofiAria')+'">'+t('start.kofi')+'</a>');
  h.push('<a class="cross-link cross-final" href="https://minsu920109-hub.github.io/contract-check/">'+t('start.cross')+'</a>');

  if(disqualified)h.push(persistentFeedbackHTML());
  $('#finalReport').innerHTML = h.join('');
  show('scr-final');

  $('#btnRetry').addEventListener('click', function(){ SFX.click(); newGame(st.practice); });

}
